function actCalPrev() {
 _actCalMonth--;
 if (_actCalMonth < 0) { _actCalMonth = 11; _actCalYear--; }
 renderActivityCalendar();
}
function actCalNext() {
 _actCalMonth++;
 if (_actCalMonth > 11) { _actCalMonth = 0; _actCalYear++; }
 renderActivityCalendar();
}

function drawActivityCalendar(teamIds) {
 const monthNames = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
 const titleEl = document.getElementById('actCalTitle');
 if (titleEl) titleEl.textContent = `ปฏิทินวันลาของทีม · ${monthNames[_actCalMonth]} ${_actCalYear + 543}`;

 // Gather activities by date
 const byDate = {};
 function add(d, cat, item) {
 byDate[d] = byDate[d] || { leave:[], leavePending:[], ot:[], otPending:[], fw:[], fwPending:[], compoff:[], compoffPending:[] };
 byDate[d][cat].push(item);
 }

 DB.load('leaveRequests').filter(r => teamIds.has(r.employeeId)).forEach(r => {
 const s = new Date(r.startDate), e = new Date(r.endDate);
 for (let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) {
 const ds = d.toISOString().split('T')[0];
 if (r.status === 'approved') add(ds, 'leave', r);
 else if (r.status === 'pending') add(ds, 'leavePending', r);
 }
 });
 DB.load('otRequests').filter(r => teamIds.has(r.employeeId)).forEach(r => {
 if (r.status === 'approved') add(r.date, 'ot', r);
 else if (r.status === 'pending') add(r.date, 'otPending', r);
 });
 DB.load('fieldWorkRequests').filter(r => teamIds.has(r.employeeId)).forEach(r => {
 if (r.status === 'approved') add(r.date, 'fw', r);
 else if (r.status === 'pending') add(r.date, 'fwPending', r);
 });
 DB.load('compOffRequests').filter(r => teamIds.has(r.employeeId)).forEach(r => {
 if (r.status === 'pending') add(r.workDate, 'compoffPending', r);
 else if (r.status === 'approved') add(r.workDate, 'compoff', r);
 });

 const settings = DB.load('settings');
 const holidays = new Set(settings.companyHolidays || []);

 const first = new Date(_actCalYear, _actCalMonth, 1);
 const startDay = first.getDay();
 const daysInMonth = new Date(_actCalYear, _actCalMonth + 1, 0).getDate();
 const totalCells = startDay + daysInMonth;
 const trailingCells = (7 - (totalCells % 7)) % 7;
 const todayStr = today();

 const dayHeaders = ['อา','จ','อ','พ','พฤ','ศ','ส'];

 // Style overrides: white grid (no gap gray), cleaner cells, smaller dots
 let html = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:0;border:1px solid var(--gray-200);border-radius:6px;overflow:hidden;background:#ffffff;">`;

 // Headers
 dayHeaders.forEach(d => html += `<div style="text-align:center;padding:10px 8px;font-size:11px;font-weight:700;color:#ffffff;background:var(--primary);text-transform:uppercase;letter-spacing:0.06em;border-right:1px solid rgba(255,255,255,0.12);">${d}</div>`);

 // Leading empty cells (before day 1) - pure white, no border issues
 for (let i = 0; i < startDay; i++) {
  html += `<div style="min-height:96px;background:#ffffff;border-top:1px solid var(--gray-200);border-right:1px solid var(--gray-200);"></div>`;
 }

 // Day cells
 for (let d = 1; d <= daysInMonth; d++) {
 const dStr = `${_actCalYear}-${String(_actCalMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 const dow = new Date(_actCalYear, _actCalMonth, d).getDay();
 const acts = byDate[dStr] || {};
 const totalPending = (acts.leavePending?.length || 0) + (acts.otPending?.length || 0) + (acts.fwPending?.length || 0) + (acts.compoffPending?.length || 0);
 const totalApproved = (acts.leave?.length || 0) + (acts.ot?.length || 0) + (acts.fw?.length || 0) + (acts.compoff?.length || 0);
 const hasActivity = totalPending + totalApproved > 0;
 const isToday = dStr === todayStr;
 const isHoliday = holidays.has(dStr);

 // Pure white default - no weekend tinting at all
 let bg = '#ffffff';
 let dayColor = 'var(--gray-700)';
 if (isHoliday) { bg = '#fef2f2'; dayColor = '#991b1b'; }
 if (isToday) { bg = 'var(--primary)'; dayColor = '#ffffff'; }

 // Dots/pills for activities - smaller, cleaner like Ex.8
 let chips = '';
 if (acts.leave?.length) chips += `<div style="display:inline-flex;align-items:center;gap:4px;background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin:2px 2px 0 0;">${acts.leave.length}</div>`;
 if (acts.ot?.length) chips += `<div style="display:inline-flex;align-items:center;gap:4px;background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin:2px 2px 0 0;">${acts.ot.length}</div>`;
 if (acts.fw?.length) chips += `<div style="display:inline-flex;align-items:center;gap:4px;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin:2px 2px 0 0;">${acts.fw.length}</div>`;
 if (totalPending) chips += `<div style="display:inline-flex;align-items:center;gap:4px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin:2px 2px 0 0;">${totalPending}</div>`;

 const clickAttr = hasActivity ? `onclick="showActivityDay('${dStr}')"` : '';
 const cursor = hasActivity ? 'cursor:pointer;' : '';

 html += `<div style="min-height:96px;padding:8px;background:${bg};color:${dayColor};border-top:1px solid var(--gray-200);border-right:1px solid var(--gray-200);${cursor}transition:background 0.15s;" ${clickAttr}${hasActivity ? ` onmouseover="this.style.background='${isToday?'var(--primary)':'var(--primary-light)'}';" onmouseout="this.style.background='${bg}';"` : ''}>
  <div style="font-size:13px;font-weight:${isToday?'700':'600'};">${d}</div>
  <div style="margin-top:4px;">${chips}</div>
 </div>`;
 }

 // Trailing empty cells - keep white to match the rest
 for (let i = 0; i < trailingCells; i++) {
  html += `<div style="min-height:96px;background:#ffffff;border-top:1px solid var(--gray-200);border-right:1px solid var(--gray-200);"></div>`;
 }

 html += '</div>';
 const grid = document.getElementById('actCalendarGrid');
 if (grid) grid.innerHTML = html;
}

function approveRequest(type, id, approve) {
 const note = approve ? '' : prompt('เหตุผลที่ปฏิเสธ:') || '';
 if (!approve && !note) return;

 const keyMap = {leave: 'leaveRequests', ot: 'otRequests', 'comp-off': 'compOffRequests', 'field-work': 'fieldWorkRequests', 'time-cert': 'timeCertRequests'};
 const key = keyMap[type];
 const reqs = DB.load(key);
 const r = reqs.find(x => x.id === id);
 if (!r) return;

 r.status = approve ? 'approved' : 'rejected';
 r.approverNote = note;
 r.approvedDate = today();
 DB.save(key, reqs);

 // If comp-off approved, add to accumulated holidays
 if (type === 'comp-off' && approve) {

 const expireMonths = settings.compOffExpireMonths || 12; // configurable in Settings
 const earned = r.workDate;

 expireDt.setMonth(expireDt.getMonth() + expireMonths);
 const expire = expireDt.toISOString().split('T')[0];
 stocks.push({
 id: uid('AH'), employeeId: r.employeeId,
 earnedDate: earned, expireDate: expire,
 used: false, usedInLeaveRequestId: null
 });
 DB.save('accumulatedHolidays', stocks);
 }

 const statusText = approve ? 'อนุมัติ' : 'ปฏิเสธ';

 notify(r.employeeId, `${emoji} คำขอ${typeLabel}ถูก${statusText}${note ? ': ' + note : ''}`, 'approval', id);

 renderNav();
}

 isStationeryAdmin: document.getElementById('empStationeryAdmin')?.checked || false,
 exemptFromLateDeduction: document.getElementById('empExemptLate')?.checked || false,
 vacationQuota: 6
 };

 if (editId) {

 emps[idx].password = pass;
 emps[idx].forceChangePassword = true; // Force change on next login
 }
 } else {
 if (emps.find(x => x.id === data.id)) {
 toast('รหัสพนักงานซ้ำ!', 'error');
 return;
 }
 data.password = pass;
 data.forceChangePassword = true; // Force change for new employees
 emps.push(data);
 }

 DB.save('employees', emps);
 closeModal();
 toast('บันทึกสำเร็จ!');
 renderPage();
}

function submitAdjustLeaveQuotas(e, id) {
 e.preventDefault();
 if (currentUser.role !== 'admin') { toast('เฉพาะ Admin', 'error'); return; }
 const emps = DB.load('employees');
 const idx = emps.findIndex(x => x.id === id);
 if (idx < 0) return;
 const emp = emps[idx];
 // v1.4.14: 'personal' ถูกล็อค ห้าม override (สิทธิ์ตามกฎหมาย)
 const types = ['vacation','sick','maternity','ordination'];
 const newOv = {};
 types.forEach(k => {
 const v = document.getElementById(`lq_${k}`)?.value.trim();
 if (v !== '' && v !== undefined && !isNaN(v)) newOv[k] = parseFloat(v);
 });
 emp.leaveQuotaOverride = Object.keys(newOv).length ? newOv : undefined;
 // Keep legacy vacationQuota in sync if user set vacation override
 if (newOv.vacation !== undefined) emp.vacationQuota = newOv.vacation;
 DB.save('employees', emps);
 auditLog('leave-quota-adjust', 'employee', id, `${emp.firstName} ${emp.lastName}: ${JSON.stringify(newOv)}`);
 closeModal();
 toast(`ปรับสิทธิ์ลา ${emp.firstName} สำเร็จ`);
 renderPage();
}

function resetLeaveQuotaOverride(id) {
 if (currentUser.role !== 'admin') return;
 const emp = getEmployee(id);
 if (!emp) return;
 if (!confirm(`รีเซ็ตสิทธิ์ลาของ ${emp.firstName} กลับเป็นค่า Default ของระบบ?`)) return;
 const emps = DB.load('employees');
 const idx = emps.findIndex(x => x.id === id);
 delete emps[idx].leaveQuotaOverride;
 // Don't touch vacationQuota — that's still a per-employee default
 DB.save('employees', emps);
 auditLog('leave-quota-reset', 'employee', id, `${emp.firstName} ${emp.lastName}`);
 closeModal();
 toast(`รีเซ็ตสิทธิ์ลา ${emp.firstName} สำเร็จ`);
 renderPage();
}

// Parse 1 line from Tigersoft .txt export
// Format: " DD/MM/YYYY HH:MM 00 EMPCODE FIRSTNAME LASTNAME EMPCODE COMPANY DEPT SERIAL..."
function parseTxtAttendanceLine(line) {
 const dateMatch = line.match(/(\d{2}\/\d{2}\/\d{4})/);
 const timeMatch = line.match(/(\d{2}:\d{2})/);
 if (!dateMatch || !timeMatch) return null;
 const codes = [...line.matchAll(/(?:^|\s)(\d{9})(?:\s|$)/g)];
 if (codes.length === 0) return null;
 const empCode = codes[0][1];
 let firstName = '', lastName = '', company = '', department = '';
 if (codes.length >= 2) {
 const startIdx = codes[0].index + codes[0][0].length;
 const endIdx = codes[1].index;
 const nameArea = line.substring(startIdx, endIdx).trim();
 const nameParts = nameArea.split(/\s{2,}/).filter(s => s.trim());
 firstName = nameParts[0] || '';
 lastName = nameParts[1] || '';
 const afterIdx = codes[1].index + codes[1][0].length;
 const afterCode = line.substring(afterIdx).trim();
 const parts = afterCode.split(/\s{2,}/).filter(s => s.trim());
 const textParts = parts.filter(p => !/^[A-Z]+\d+$/.test(p));
 company = textParts[0] || '';
 department = textParts[1] || '';
 }
 return { date: dateMatch[1], time: timeMatch[1], empCode, firstName, lastName, company, department };
}

// Parse date from various formats: Date object, "DD/MM/YYYY" string, "YYYY-MM-DD" string
// Parse any date value (Date object, DD/MM string, ISO string) → 'YYYY-MM-DD'
// opts.format: 'DD/MM' (Thai default) or 'MM/DD' (US)
// IMPORTANT: Tigersoft exports DD/MM/YYYY. Excel locale (US) auto-parses ambiguous
// dates (both ≤ 12) as MM/DD → datetime fields end up with month/day SWAPPED.
// For DD/MM mode, swap them back to restore intent.
function parseAnyDate(v, opts = {}) {
 const fmt = opts.format === 'MM/DD' ? 'MM/DD' : 'DD/MM'; // default Thai
 if (!v) return null;
 if (v instanceof Date && !isNaN(v)) {
 const y = v.getFullYear();
 let m = v.getMonth() + 1;
 let d = v.getDate();
 // Excel parsed in US locale; swap to restore DD/MM intent
 if (fmt === 'DD/MM') [m, d] = [d, m];
 return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 }
 const s = String(v).trim();
 // YYYY-MM-DD (ISO already)
 if (s.match(/^\d{4}-\d{2}-\d{2}/)) return s.slice(0, 10);
 // X/Y/YYYY (slash-separated)
 let match = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 if (match) {
 const a = +match[1], b = +match[2];
 if (fmt === 'DD/MM') {
 return `${match[3]}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
 }
 return `${match[3]}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
 }
 // X-Y-YYYY (dash-separated, treat as DD-MM-YYYY in Thai context)
 match = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
 if (match) {
 const a = +match[1], b = +match[2];
 if (fmt === 'DD/MM') {
 return `${match[3]}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
 }
 return `${match[3]}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
 }
 return null;
}

// Look up department from system (by employee code) — fallback "พนักงานใหม่" if not found
// ใช้ใน attendance reports เพื่อให้แผนกตรงกับระบบเสมอ (ไม่ใช่ค่าจาก Excel ตอนอัปโหลด)
function getDeptForAttendance(rec) {
 if (!rec) return '-';
 const emp = getEmployee(rec.employeeId || rec.employeeCode);
 if (emp && emp.department) return emp.department;
 // ลองค้นจากรหัสพนักงาน (กรณี employeeId ไม่ตรงแต่ employeeCode ตรง)
 if (rec.employeeCode) {
 const emps = DB.load('employees');
 const found = emps.find(e => e.id === rec.employeeCode);
 if (found && found.department) return found.department;
 }
 return 'พนักงานใหม่';
}

// NORMALIZE TO DD/MM/YYYY (Step 1 of upload pipeline)
// ============================================================
// ตามคำสั่ง User: "เมื่อรับไฟล์แล้ว ให้ดำเนินการแปลง Format Column A
//                  อย่างไรก็ตามให้เป็น DD/MM/YYYY ก่อนการนำข้อมูลไปใช้งานเสมอ"
//
// Excel auto-parses values as datetime when ambiguous (US locale MM/DD).
// We normalize ALL cells to DD/MM/YYYY string format BEFORE any other processing.
//
// Input → Output:
//   datetime(2026, 1, 6)  → "01/06/2026"  (Excel month → DD, Excel date → MM)
//   "13/06/2026" (string) → "13/06/2026"  (already DD/MM, keep)
//   "2026-06-13" (ISO)    → "13/06/2026"  (convert)
//   number 46028 (serial) → handled by SheetJS into datetime first
function normalizeToDDMMString(v) {
 if (v === null || v === undefined || v === '') return null;

 // Case 1: Excel auto-parsed datetime (US locale interpretation)
 // Original Tigersoft string "DD/MM/YYYY" → Excel saw as MM/DD → datetime object
 // To recover: take Excel's month value AS DD, Excel's date value AS MM
 if (v instanceof Date && !isNaN(v)) {
 const y = v.getFullYear();
 const excelMonth = v.getMonth() + 1; // = original DD
 const excelDate = v.getDate(); // = original MM
 return `${String(excelMonth).padStart(2,'0')}/${String(excelDate).padStart(2,'0')}/${y}`;
 }

 const s = String(v).trim();

 // Case 2: ISO format YYYY-MM-DD → convert to DD/MM/YYYY
 let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
 if (m) {
 return `${m[3].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[1]}`;
 }

 // Case 3: Already X/Y/YYYY string format
 m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 if (m) {
 const a = +m[1], b = +m[2];
 // If first number > 12, must be DD (Thai DD/MM intent)
 if (a > 12 && b <= 12) {
 return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[3]}`;
 }
 // If second number > 12, original was MM/DD (US) — convert
 if (b > 12 && a <= 12) {
 return `${m[2].padStart(2,'0')}/${m[1].padStart(2,'0')}/${m[3]}`;
 }
 // Ambiguous (both ≤ 12): assume DD/MM (Thai default) — keep as-is
 return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[3]}`;
 }

 // Case 4: Dash-separated DD-MM-YYYY → convert to slash
 m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
 if (m) {
 return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[3]}`;
 }

 console.warn(`[normalizeToDDMMString] Cannot normalize: ${JSON.stringify(v)}`);
 return null;
}

// Apply normalization in-place to Column A of rows array
// Returns stats: { datetime: N, string: M, iso: K, errors: E, total: T }
function normalizeAttendanceColumnA(rows, dateColIdx = 0) {
 const stats = { datetime: 0, string: 0, iso: 0, errors: 0, total: 0 };
 const errorRows = [];
 for (let i = 1; i < rows.length; i++) {
 if (!rows[i] || rows[i][dateColIdx] === undefined || rows[i][dateColIdx] === null) continue;
 stats.total++;
 const original = rows[i][dateColIdx];
 const wasDate = original instanceof Date;
 const wasISO = typeof original === 'string' && /^\d{4}-/.test(original);

 const normalized = normalizeToDDMMString(original);
 if (normalized === null) {
 stats.errors++;
 if (errorRows.length < 5) errorRows.push({ row: i+1, value: original });
 continue;
 }
 rows[i][dateColIdx] = normalized;
 if (wasDate) stats.datetime++;
 else if (wasISO) stats.iso++;
 else stats.string++;
 }
 if (errorRows.length) {
 console.warn('[Normalize] Sample errors:', errorRows);
 }
 console.log(`[Normalize] Column A → DD/MM/YYYY:`, stats);
 return stats;
}

// Detect date format from string cells in the workbook (any cell with day > 12 = DD/MM confirmed)
function detectExcelDateFormat(workbook, dateColIdx = 0) {
 let ddmm = 0, mmdd = 0;
 for (const sn of workbook.SheetNames) {
 const ws = workbook.Sheets[sn];
 const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
 for (let i = 1; i < rows.length; i++) {
 const v = rows[i] && rows[i][dateColIdx];
 if (typeof v !== 'string') continue;
 const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 if (!m) continue;
 const a = +m[1], b = +m[2];
 if (a > 12 && b <= 12) ddmm++;
 else if (b > 12 && a <= 12) mmdd++;
 }
 }
 if (ddmm > mmdd) return { format: 'DD/MM', confidence: 'high', evidence: { ddmm, mmdd } };
 if (mmdd > ddmm) return { format: 'MM/DD', confidence: 'high', evidence: { ddmm, mmdd } };
 return { format: 'DD/MM', confidence: 'default', evidence: { ddmm, mmdd } }; // Thai default
}

// Parse time from Date object or "HH:MM" string
function parseAnyTime(v) {
 if (!v) return null;
 if (v instanceof Date && !isNaN(v)) {
 return `${String(v.getHours()).padStart(2,'0')}:${String(v.getMinutes()).padStart(2,'0')}`;
 }
 const s = String(v).trim();
 const m = s.match(/(\d{1,2}):(\d{2})/);
 if (m) return `${m[1].padStart(2,'0')}:${m[2]}`;
 return null;
}

// Backward-compat alias
function parseExcelDate(s) { return parseAnyDate(s); }

// ============================================================
// AUTO-ABSENT + TIME CERT HELPERS
// ============================================================
// Returns "HH:MM" cutoff — anyone checking in at-or-after this is auto-absent. Returns null if disabled.
function computeAutoAbsentCutoff(settings) {
 const mins = settings.autoAbsentLateMinutes;
 if (!mins || mins <= 0) return null;
 const [lH, lM] = (settings.lateThreshold || '09:01').split(':').map(Number);
 const total = lH * 60 + lM + mins;
 if (total >= 24 * 60) return '23:59'; // clamp
 return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
}

// Merge approved time-cert requests for a specific date into the attendance pool
function mergeApprovedTimeCertForDate(records, dateStr) {
 const certs = DB.load('timeCertRequests', []).filter(c => c.status === 'approved' && c.date === dateStr);
 if (!certs.length) return records;
 const byKey = {};
 records.forEach(r => { byKey[`${r.employeeId}|${r.date}`] = r; });
 const merged = [...records];
 certs.forEach(c => {
 const k = `${c.employeeId}|${c.date}`;
 const emp = getEmployee(c.employeeId);
 if (byKey[k]) {
 // Update existing record's check-in if cert moves it earlier
 const idx = merged.findIndex(r => r.employeeId === c.employeeId && r.date === c.date);
 if (idx >= 0) {
 merged[idx] = {
 ...merged[idx],
 checkIn: c.claimedCheckIn || merged[idx].checkIn,
 checkOut: c.claimedCheckOut || merged[idx].checkOut,
 _certified: true,
 _certReason: c.reason
 };
 }
 } else {
 // No record at all — inject one from the cert
 merged.push({
 id: `CERT-${c.id}`,
 employeeId: c.employeeId,
 employeeCode: emp?.id || c.employeeId,
 employeeName: emp ? `${emp.firstName} ${emp.lastName}` : '-',
 department: emp?.department || '-',
 date: c.date,
 checkIn: c.claimedCheckIn,
 checkOut: c.claimedCheckOut || null,
 scans: [c.claimedCheckIn, c.claimedCheckOut].filter(Boolean),
 status: 'present',
 _certified: true,
 _certReason: c.reason
 });
 }
 });
 return merged;
}

// Merge approved time-cert requests across an entire month range
function mergeApprovedTimeCertForMonth(records, monthStr) {
 const certs = DB.load('timeCertRequests', []).filter(c => c.status === 'approved' && c.date.startsWith(monthStr));
 if (!certs.length) return records;
 const dates = [...new Set(certs.map(c => c.date))];
 let merged = records;
 dates.forEach(d => { merged = mergeApprovedTimeCertForDate(merged, d); });
 return merged;
}

function confirmUploadAttendance() {
 if (!_attendanceBuffer) return;
 const existing = DB.load('attendanceRecords');
 // Remove existing records for the same dates+employees (to avoid duplicates)
 const newRecords = _attendanceBuffer;
 const keys = new Set(newRecords.map(r => `${r.employeeCode}|${r.date}`));
 const filtered = existing.filter(r => !keys.has(`${r.employeeCode}|${r.date}`));
 DB.save('attendanceRecords', [...filtered, ...newRecords]);
 _attendanceBuffer = null;
 toast(`บันทึก ${newRecords.length} records สำเร็จ`);
 renderPage();
}

function renderAttendanceReport() {
 try {
 let records;

 records = DB.load('attendanceRecords');
 } catch (loadErr) {
 console.error('[AttendanceReport] localStorage corrupted:', loadErr);
 document.getElementById('mainContent').innerHTML = `
 <div class="page-header"><h1>รายงานเข้างาน</h1></div>
 <div class="alert alert-error mb-3">
 <strong>ข้อมูล attendance ใน localStorage เสียหาย</strong><br>${loadErr.message}<br><br>
 <button class="btn btn-danger" onclick="if(confirm('ลบข้อมูล attendance ทั้งหมด?')){localStorage.removeItem('hr_attendanceRecords');renderPage();}">รีเซ็ตข้อมูล Attendance</button>
 </div>`;
 return;
 }
 if (!Array.isArray(records)) {
 console.error('[AttendanceReport] records is not array:', typeof records, records);
 records = [];
 }
 const dates = [...new Set(records.map(r => r.date))].sort().reverse();
 if (!dates.includes(_attReportDate) && dates.length) _attReportDate = dates[0];

 // CRITICAL: filter records to selected date FIRST, then merge cert for that date
 const dayRecordsRaw = records.filter(r => r.date === _attReportDate);
 const dayRecords = mergeApprovedTimeCertForDate(dayRecordsRaw, _attReportDate);
 const settings = DB.load('settings');
 const workStart = settings.workStartTime || '08:45';
 const lateThreshold = settings.lateThreshold || '09:01';
 const autoAbsentCutoff = computeAutoAbsentCutoff(settings);

 // Categorize by employeeCode (unique per person per day) — apply auto-absent rule
 // ใช้ Map keyed by employeeCode เพื่อให้แต่ละ "คน" นับเพียงครั้งเดียวต่อวัน
 const byEmp = new Map();
 dayRecords.forEach(r => {
 const key = r.employeeCode || r.employeeId || `_${r.id}`;
 // ถ้ามีหลายเรคคอร์ดสำหรับคนเดียวกัน → เก็บเรคคอร์ดที่ checkIn เร็วสุด
 const existing = byEmp.get(key);
 if (!existing) { byEmp.set(key, r); return; }
 if (r.checkIn && (!existing.checkIn || r.checkIn < existing.checkIn)) byEmp.set(key, r);
 });
 const uniqueDayRecords = [...byEmp.values()];

 const presentRaw = uniqueDayRecords.filter(r => r.checkIn);
 const autoAbsent = autoAbsentCutoff ? presentRaw.filter(r => r.checkIn >= autoAbsentCutoff) : [];
 const present = autoAbsentCutoff ? presentRaw.filter(r => r.checkIn < autoAbsentCutoff) : presentRaw;

 // Leave on that date
 const leaveOnDate = DB.load('leaveRequests').filter(r =>
 r.status === 'approved' &&
 new Date(r.startDate) <= new Date(_attReportDate) &&
 new Date(r.endDate) >= new Date(_attReportDate)
 );

 // v1.4.19 CRITICAL FIX: derive absent from EMPLOYEE MASTER, not from attendance file.
 // Tigersoft export contains only rows for employees who scanned — absent people are NOT in file.
 // Before: `absent = uniqueDayRecords.filter(r => !r.checkIn)` → always 0 (Tigersoft never exports no-scan rows)
 // After: `absent = active employees - present - autoAbsent - onLeave`
 const activeEmps = DB.load('employees').filter(e => e.active && e.role !== 'admin');
 const presentIds = new Set(present.map(r => r.employeeCode || r.employeeId));
 const autoAbsentIds = new Set(autoAbsent.map(r => r.employeeCode || r.employeeId));
 const leaveIds = new Set(leaveOnDate.map(r => r.employeeId));
 const trackedInFile = new Set(uniqueDayRecords.map(r => r.employeeCode || r.employeeId));

 // Employees explicitly marked absent in file (checkIn missing but row exists)
 const explicitAbsent = uniqueDayRecords.filter(r => !r.checkIn);
 // Employees not in file at all AND not on leave AND active → didn't scan = absent
 const inferredAbsent = activeEmps
 .filter(e => !presentIds.has(e.id) && !autoAbsentIds.has(e.id) && !leaveIds.has(e.id) && !trackedInFile.has(e.id))
 .map(e => ({
 date: _attReportDate,
 employeeCode: e.id,
 employeeId: e.id,
 employeeName: `${e.firstName} ${e.lastName}`,
 checkIn: null,
 checkOut: null,
 _inferredAbsent: true // marker: no row in Tigersoft file
 }));

 const absent = [
 ...explicitAbsent,
 ...inferredAbsent,
 ...autoAbsent.map(r => ({ ...r, _autoAbsent: true }))
 ];

 console.log(`[AttReport ${_attReportDate}] active=${activeEmps.length}, present=${present.length}, autoAbsent=${autoAbsent.length}, leave=${leaveOnDate.length}, absent=${absent.length} (explicit=${explicitAbsent.length}, inferred=${inferredAbsent.length})`);

 const arrivedFromStart = present.filter(r => r.checkIn >= workStart);
 const lateArrived = present.filter(r => r.checkIn >= lateThreshold);
 const onTime = present.filter(r => r.checkIn < workStart);

 document.getElementById('mainContent').innerHTML = `

 <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">

 ${dates.length ? dates.map(d => `<option value="${d}" ${d === _attReportDate ? 'selected' : ''}>${formatDate(d)}</option>`).join('') : '<option>-</option>'}
 </select>
 ${dates.length ? `

 <small style="opacity:0.7;">ดูรายละเอียดใน DevTools Console (F12)</small><br><br>
 <details><summary style="cursor:pointer;">รายละเอียดทางเทคนิค</summary>
 <pre style="background:#fff;padding:10px;margin-top:10px;border-radius:6px;font-size:11px;overflow:auto;max-height:200px;">${(err.stack||'').replace(/</g,'&lt;')}</pre>
 </details>
 </div>`;
 }
}

}

 dayRecords.forEach(r => {

 });

// ============================================================
// EXPORT ATTENDANCE REPORT AS PNG (download + share)
// ============================================================
async function exportAttendanceReportPNG(mode) {
 const target = document.getElementById('attReportCapture');
 if (!target) { toast('ไม่พบเนื้อหารายงาน', 'error'); return; }
 if (typeof html2canvas !== 'function') {
 toast('ไลบรารี html2canvas โหลดไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต', 'error');
 return;
 }
 // Make all tab sections visible during capture so all data shows
 const sections = document.querySelectorAll('.att-section');
 const origDisplay = [];
 sections.forEach((s, i) => { origDisplay[i] = s.style.display; s.style.display = 'block'; });
 toast('กำลังสร้างรูป...', 'info');
 try {
 const canvas = await html2canvas(target, {
 backgroundColor: '#ffffff',
 scale: 2,
 logging: false,
 useCORS: true,
 windowWidth: target.scrollWidth,
 windowHeight: target.scrollHeight
 });
 // Restore display
 sections.forEach((s, i) => { s.style.display = origDisplay[i]; });

 const filename = `รายงานเข้างาน-${_attReportDate}.png`;

 if (mode === 'download') {
 const link = document.createElement('a');
 link.download = filename;
 link.href = canvas.toDataURL('image/png');
 link.click();
 toast('ดาวน์โหลดสำเร็จ');
 return;
 }

 // Share mode — Web Share API
 const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
 if (!blob) { toast('สร้างไฟล์ภาพไม่สำเร็จ', 'error'); return; }
 const file = new File([blob], filename, { type: 'image/png' });

 if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
 try {
 await navigator.share({
 files: [file],
 title: `รายงานการเข้างาน ${formatDate(_attReportDate)}`,
 text: `รายงานการเข้างาน วันที่ ${formatDate(_attReportDate)}`
 });
 return;
 } catch (e) {
 if (e.name === 'AbortError') return; // user cancelled
 console.warn('Share API failed, falling back:', e);
 }
 }

 // Fallback: copy to clipboard if supported
 if (navigator.clipboard && navigator.clipboard.write) {
 try {
 await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
 toast('Browser ไม่รองรับการแชร์โดยตรง — คัดลอกรูปไปคลิปบอร์ดแล้ว', 'info');
 return;
 } catch (e) { console.warn('Clipboard failed:', e); }
 }

 // Final fallback: open preview modal
 const dataUrl = canvas.toDataURL('image/png');
 showModal('ตัวอย่างรายงาน', `
 <div class="alert alert-info mb-3">Browser ของคุณยังไม่รองรับการแชร์โดยตรง — กดค้างที่รูปเพื่อบันทึก/แชร์ไปยังแอปอื่น</div>
 <div style="text-align:center;"><img src="${dataUrl}" style="max-width:100%;border:1px solid var(--gray-300);border-radius:8px;"></div>
 `, `
 <button class="btn btn-secondary" onclick="closeModal()">ปิด</button>
 <button class="btn btn-primary" onclick="exportAttendanceReportPNG('download'); closeModal();">ดาวน์โหลด</button>
 `);
 } catch (err) {
 // Restore display on error
 sections.forEach((s, i) => { s.style.display = origDisplay[i]; });
 console.error('[exportAttendanceReportPNG] failed:', err);
 toast('สร้างรูปไม่สำเร็จ: ' + err.message, 'error');
 }
}

// ============================================================
// PAY SLIP CALCULATION
// ============================================================
function calculatePaySlip(employeeId, year, month) {
 const emp = getEmployee(employeeId);
 if (!emp) return null;

 const settings = DB.load('settings');
 const monthStr = `${year}-${String(month).padStart(2,'0')}`;
 const lateThreshold = settings.lateThreshold || '09:01';
 const otMultiplier = settings.otMultiplier || 1.5;
 const otMultiplierHoliday = settings.otMultiplierHoliday || 3;
 const companyHolidays = new Set(settings.companyHolidays || []);
 const isHolidayDate = (dStr) => {
 if (!dStr) return false;
 if (companyHolidays.has(dStr)) return true;
 const dow = new Date(dStr).getDay();
 return dow === 0 || dow === 6; // เสาร์ อาทิตย์
 };
 const lateDeduction = settings.lateDeduction ?? 50;
 const lateCalculationMode = settings.lateCalculationMode || 'occurrence';
 const workDaysPerMonth = settings.workDaysPerMonth || 22;
 const workHoursPerDay = settings.workHoursPerDay || 8;
 const diligenceBonus = settings.diligenceBonus || 500;
 const diligenceLateThreshold = settings.diligenceLateThreshold || lateThreshold;

 // Attendance for this month — merge approved time certifications
 const rawAttendance = DB.load('attendanceRecords').filter(r =>
 r.employeeId === employeeId && r.date.startsWith(monthStr)
 );
 const attendance = mergeApprovedTimeCertForMonth(rawAttendance, monthStr);
 // Auto-absent: anyone with checkIn >= cutoff is excluded from workDays + lateRecords
 const autoAbsentCutoff = computeAutoAbsentCutoff(settings);
 const presentInMonth = autoAbsentCutoff
 ? attendance.filter(r => r.checkIn && r.checkIn < autoAbsentCutoff)
 : attendance.filter(r => r.checkIn);
 const autoAbsentDays = autoAbsentCutoff
 ? attendance.filter(r => r.checkIn && r.checkIn >= autoAbsentCutoff).length
 : 0;
 const workDays = presentInMonth.length;
 const lateRecords = presentInMonth.filter(r => r.checkIn >= lateThreshold);
 const lateDays = lateRecords.length;

 // Calculate total late minutes (for minute/hour mode)
 const [lthH, lthM] = lateThreshold.split(':').map(Number);
 const thresholdMinutes = lthH * 60 + lthM;
 let totalLateMinutes = 0;
 lateRecords.forEach(r => {
 const [h, m] = r.checkIn.split(':').map(Number);
 totalLateMinutes += Math.max(0, (h * 60 + m) - thresholdMinutes);
 });
 const totalLateHours = Math.ceil(totalLateMinutes / 60);

 // OT for this month — split into normal vs holiday
 const otReqs = DB.load('otRequests').filter(r =>
 r.employeeId === employeeId && r.status === 'approved' && r.date.startsWith(monthStr)
 );
 const otHours = otReqs.reduce((sum, r) => sum + r.hours, 0);
 const otHoursNormal = otReqs.filter(r => !isHolidayDate(r.date)).reduce((sum, r) => sum + r.hours, 0);
 const otHoursHoliday = otReqs.filter(r => isHolidayDate(r.date)).reduce((sum, r) => sum + r.hours, 0);

 // Leave for this month
 const leaves = DB.load('leaveRequests').filter(r =>
 r.employeeId === employeeId && r.status === 'approved'
 );
 let leaveDays = 0;
 let unpaidDaysThisMonth = 0; // new — count by days (รองรับครึ่งวัน)
 let unpaidHoursLegacy = 0; // backward-compat for old hourly records
 leaves.forEach(r => {
 if (r.type === 'unpaid' && r.startDate.startsWith(monthStr)) {
 if (r.unpaidHours && r.unpaidHours > 0) {
 // Legacy hourly record
 unpaidHoursLegacy += r.unpaidHours;
 } else {
 // New day-based record (รวมครึ่งวัน via r.days = 0.5)
 unpaidDaysThisMonth += r.days || 0;
 }
 return;
 }
 const start = new Date(r.startDate);
 const end = new Date(r.endDate);
 for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
 if (d.toISOString().slice(0,7) === monthStr) leaveDays++;
 }
 });

 // Salary calculation
 const baseSalary = emp.monthlySalary || 0;
 const hourlyRate = baseSalary / workDaysPerMonth / workHoursPerDay;
 const otPayNormal = otHoursNormal * hourlyRate * otMultiplier;
 const otPayHoliday = otHoursHoliday * hourlyRate * otMultiplierHoliday;
 const otPay = otPayNormal + otPayHoliday;

 // Late deduction - choose mode
 let lateDeducTotal = 0;
 let lateUnit = '';
 if (emp.exemptFromLateDeduction) {
 lateDeducTotal = 0;
 lateUnit = 'ยกเว้น (พนักงานคนนี้ถูกตั้งให้ไม่หักเงินมาสาย)';
 } else if (lateCalculationMode === 'minute') {
 lateDeducTotal = totalLateMinutes * lateDeduction;
 lateUnit = `${totalLateMinutes} นาที × ${lateDeduction}`;
 } else if (lateCalculationMode === 'hour') {
 lateDeducTotal = totalLateHours * lateDeduction;
 lateUnit = `${totalLateHours} ชม. × ${lateDeduction}`;
 } else { // occurrence
 lateDeducTotal = lateDays * lateDeduction;
 lateUnit = `${lateDays} ครั้ง × ${lateDeduction}`;
 }

 // Unpaid leave deduction
 // - New (day-based): days × dailyRate (รองรับ 0.5 = ครึ่งวัน)
 // - Legacy (hourly): hours × hourlyRate
 const dailyRate = hourlyRate * workHoursPerDay;
 const unpaidDeduction = unpaidDaysThisMonth * dailyRate + unpaidHoursLegacy * hourlyRate;
 const unpaidHoursThisMonth = unpaidDaysThisMonth * workHoursPerDay + unpaidHoursLegacy; // total hours for display compat

 // Diligence bonus - eligibility check
 // v1.4.11: comp-off (ลาสะสมวันหยุด) = สลับวันหยุด ไม่ใช่ลาจริง → ไม่ตัดเบี้ยขยัน
 const hasLeaveThisMonth = leaves.some(r => {
 if (r.type === 'comp-off') return false; // exclude — comp-off คือสลับวันหยุด
 if (r.type === 'unpaid' && r.startDate.startsWith(monthStr)) return true;
 const s = new Date(r.startDate), e = new Date(r.endDate);
 for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
 if (d.toISOString().slice(0,7) === monthStr) return true;
 }
 return false;
 });
 const hasLateThisMonth = attendance.some(r => r.checkIn && r.checkIn >= diligenceLateThreshold);
 const hasAbsentThisMonth = attendance.some(r => !r.checkIn);
 const eligibleForDiligence = !hasLeaveThisMonth && !hasLateThisMonth && !hasAbsentThisMonth && workDays > 0;
 const diligenceAmount = eligibleForDiligence ? diligenceBonus : 0;
 const diligenceReasons = [];
 if (hasLeaveThisMonth) diligenceReasons.push('มีการลา');
 if (hasLateThisMonth) diligenceReasons.push('มาสาย');
 if (hasAbsentThisMonth) diligenceReasons.push('ขาดงาน');

 // Commissions for this month
 const commissions = DB.load('commissions').filter(c =>
 c.employeeId === employeeId && c.monthStr === monthStr
 );
 const commissionTotal = commissions.reduce((sum, c) => sum + (c.amount || 0), 0);

 // Social Security (ประกันสังคม)
 const sso = calculateSSO(emp, settings);

 const netPay = baseSalary + otPay + diligenceAmount + commissionTotal
 - lateDeducTotal - unpaidDeduction - sso.amount;

 return {
 employeeId, year, month, monthStr,
 baseSalary, otHours, otPay, hourlyRate, otMultiplier, otMultiplierHoliday,
 otHoursNormal, otHoursHoliday, otPayNormal, otPayHoliday,
 workDays, lateDays, autoAbsentDays, lateDeduction, lateDeducTotal, lateUnit, lateCalculationMode,
 totalLateMinutes, totalLateHours,
 leaveDays, unpaidDays: unpaidDaysThisMonth, unpaidHours: unpaidHoursThisMonth, unpaidDeduction, dailyRate,
 diligenceAmount, diligenceBonus, eligibleForDiligence, diligenceReasons,
 commissions, commissionTotal,
 sso,
 netPay,
 generatedAt: new Date().toISOString()
 };
}

// คำนวณประกันสังคมตามกฎหมายไทย
// 5% ของฐานเงินเดือน (ฐานขั้นต่ำ 1,650 บาท ขั้นสูง 15,000 บาท → max 750 บาท/เดือน)
// emp.ssoOverride: ถ้ามีค่า → ใช้ค่านี้แทนการคำนวณ (สำหรับกรณีพิเศษ)
function calculateSSO(emp, settings) {
 const enabled = settings.ssoEnabled !== false;
 if (!enabled) return { amount: 0, base: 0, rate: 0, override: false, enabled: false };

 const rate = settings.ssoRate ?? 5;
 const minBase = settings.ssoMinBase ?? 1650;
 const maxBase = settings.ssoMaxBase ?? 15000;

 // Override per employee (ถ้า Admin ตั้งค่าเอง)
 if (emp.ssoOverride !== undefined && emp.ssoOverride !== null && emp.ssoOverride !== '') {
 const override = parseFloat(emp.ssoOverride);
 if (!isNaN(override) && override >= 0) {
 return { amount: override, base: 0, rate: 0, override: true, enabled: true };
 }
 }

 const salary = emp.monthlySalary || 0;
 let base = salary;
 if (base < minBase) base = minBase;
 if (base > maxBase) base = maxBase;
 const amount = base * rate / 100;
 return { amount, base, rate, override: false, enabled: true, minBase, maxBase };
}

function parseEmployeeFromInput(value) {

 return emp || null;
}

function submitBulkCommission(e) {
 e.preventDefault();
 const monthStr = document.getElementById('bulkCommMonth').value;
 if (!monthStr) { toast('กรุณาเลือกเดือน', 'error'); return; }

 const container = document.getElementById('bulkRowsContainer');
 const rows = container.querySelectorAll('[id^="bulkRow_"]');
 const commissions = DB.load('commissions');
 let added = 0, skipped = 0, errors = [];

 rows.forEach((row, i) => {
 const empVal = row.querySelector('.bulk-emp').value.trim();
 const amountVal = row.querySelector('.bulk-amount').value;
 const descVal = row.querySelector('.bulk-desc').value.trim();

 // Skip empty rows
 if (!empVal && !amountVal) return;

 const emp = parseEmployeeFromInput(empVal);
 const amount = parseFloat(amountVal);

 if (!emp) { errors.push(`แถว ${i+1}: ไม่พบพนักงาน "${empVal}"`); skipped++; return; }
 if (!(amount > 0)) { errors.push(`แถว ${i+1}: จำนวนเงินไม่ถูกต้อง (${emp.firstName})`); skipped++; return; }

 commissions.push({
 id: uid('CM'),
 employeeId: emp.id, monthStr,
 amount, description: descVal,
 addedAt: new Date().toISOString(),
 addedBy: currentUser.id
 });
 notify(emp.id,
 ` ได้รับค่าคอมมิชชั่น ${amount.toLocaleString()} บาท เดือน ${monthStr}${descVal ? ' • ' + descVal : ''}`,
 'commission', null);
 added++;
 });

 if (added > 0) {
 DB.save('commissions', commissions);
 }

 if (errors.length) {
 alert(`บันทึกเสร็จ\n\n สำเร็จ: ${added} รายการ\n ข้ามไป: ${skipped} รายการ\n\nปัญหา:\n${errors.join('\n')}`);
 }

 if (added > 0) {
 closeModal();
 toast(`บันทึก ${added} รายการสำเร็จ${skipped > 0 ? ` (ข้าม ${skipped})` : ''}`);
 renderPage();
 } else if (!errors.length) {
 toast('ไม่มีรายการที่จะบันทึก', 'error');
 }
}

function deleteCommission(id) {
 const c = DB.load('commissions').find(x => x.id === id);
 if (!c) return;
 const e = getEmployee(c.employeeId);
 if (!confirm(`ลบรายการค่าคอมมิชชั่นของ ${e ? e.firstName + ' ' + e.lastName : c.employeeId} จำนวน ${c.amount.toLocaleString()} บาท?`)) return;
 DB.save('commissions', DB.load('commissions').filter(x => x.id !== id));
 toast('ลบสำเร็จ');
 renderPage();
}

function renderCommissionReport() {
 const year = _commReportYear;
 const allCommissions = DB.load('commissions');
 const yearCommissions = allCommissions.filter(c => c.monthStr && c.monthStr.startsWith(`${year}-`));

 // Build matrix: empId -> {monthStr: total, yearTotal}
 const matrix = {};
 yearCommissions.forEach(c => {
 if (!matrix[c.employeeId]) matrix[c.employeeId] = { months: {}, yearTotal: 0, count: 0 };
 const mm = c.monthStr.split('-')[1];
 matrix[c.employeeId].months[mm] = (matrix[c.employeeId].months[mm] || 0) + c.amount;
 matrix[c.employeeId].yearTotal += c.amount;
 matrix[c.employeeId].count++;
 });

 // Sort employees by year total desc
 const sortedEmpIds = Object.keys(matrix).sort((a, b) => matrix[b].yearTotal - matrix[a].yearTotal);

 // Monthly totals across all employees
 const monthTotals = {};
 for (let m = 1; m <= 12; m++) {
 const mm = String(m).padStart(2, '0');
 monthTotals[mm] = sortedEmpIds.reduce((sum, eid) => sum + (matrix[eid].months[mm] || 0), 0);
 }
 const grandTotal = Object.values(monthTotals).reduce((s, v) => s + v, 0);

 const monthNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

 // Available years from data
 const availableYears = [...new Set(allCommissions.map(c => c.monthStr?.split('-')[0]).filter(Boolean))].sort().reverse();
 if (!availableYears.includes(String(year))) availableYears.unshift(String(year));

 <select onchange="_commReportYear=parseInt(this.value); renderCommissions()" style="padding:6px 12px;border:1px solid var(--gray-300);border-radius:6px;">
 ${availableYears.map(y => `<option value="${y}" ${parseInt(y)===year?'selected':''}>${y} (พ.ศ. ${parseInt(y)+543})</option>`).join('')}

 <button class="btn btn-success btn-sm" onclick="exportCommissionReport()">⬇ Export CSV</button>

 <div class="stats-grid">

 </div>

async function generatePaySlipImage(empId, year, month) {
 const slip = calculatePaySlip(empId, year, month);
 const emp = getEmployee(empId);
 if (!slip || !emp) return null;

 const monthName = new Date(year, month-1, 1).toLocaleDateString('th-TH', { year:'numeric', month:'long'});

 // Build off-screen container
 const container = document.createElement('div');
 container.style.cssText = 'position:fixed;left:-99999px;top:0;z-index:-1;';
 container.innerHTML = buildPaySlipHTML(slip, emp, monthName);
 document.body.appendChild(container);
 const target = container.firstElementChild;

 // Render with html2canvas
 try {
 const canvas = await html2canvas(target, {
 backgroundColor: '#ffffff',
 scale: 2, // 2x resolution
 useCORS: true,
 logging: false,
 windowWidth: 800
 });

 // Save the slip to history
 const slips = DB.load('paySlips');
 const existing = slips.findIndex(s => s.employeeId === empId && s.monthStr === slip.monthStr);
 if (existing >= 0) slips[existing] = slip;
 else slips.push(slip);
 DB.save('paySlips', slips);

 // Get blob
 return await new Promise(resolve => {
 canvas.toBlob(blob => {
 resolve({ blob, slip, emp, dataUrl: canvas.toDataURL('image/png') });
 }, 'image/png', 0.95);
 });
 } finally {
 document.body.removeChild(container);
 }
}

async function downloadPaySlipImage(empId, year, month) {
 toast('กำลังสร้างสลิป...', 'info');
 const result = await generatePaySlipImage(empId, year, month);
 if (!result) { toast('สร้างสลิปไม่สำเร็จ', 'error'); return; }
 const { blob, slip, emp } = result;
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = `Slip_${emp.id}_${slip.monthStr}.png`;
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 setTimeout(() => URL.revokeObjectURL(url), 1000);
 toast('ดาวน์โหลดสลิปสำเร็จ ');
}

async function sharePaySlip(empId, year, month) {
 toast('กำลังเตรียมสลิป...', 'info');
 const result = await generatePaySlipImage(empId, year, month);
 if (!result) { toast('สร้างสลิปไม่สำเร็จ', 'error'); return; }
 const { blob, slip, emp } = result;
 const filename = `Slip_${emp.id}_${slip.monthStr}.png`;
 const file = new File([blob], filename, { type: 'image/png' });

 // Try Web Share API with files
 if (navigator.canShare && navigator.canShare({ files: [file] })) {
 try {
 await navigator.share({
 files: [file],
 title: 'สลิปเงินเดือน',
 text: `สลิปเงินเดือน ${emp.firstName} ${emp.lastName} - ${slip.monthStr}`
 });
 toast('แชร์สลิปสำเร็จ ');
 return;
 } catch (err) {
 if (err.name === 'AbortError') return; // user cancelled
 console.warn('Share failed:', err);
 }
 }

 // Fallback: try copy to clipboard
 if (navigator.clipboard && window.ClipboardItem) {
 try {
 await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
 toast('Browser ไม่รองรับ Share โดยตรง — คัดลอกรูปไปคลิปบอร์ดแล้ว ', 'info');
 return;
 } catch (e) {
 console.warn('Clipboard failed:', e);
 }
 }

 // Final fallback: open preview modal
 showPaySlipPreviewModal(result);
}

 const monthStr = _lateReportMonth || new Date().toISOString().slice(0, 7);

 const records = DB.load('attendanceRecords').filter(r =>
 r.checkIn && r.checkIn >= lateThreshold && r.date.startsWith(monthStr) &&
 (scopeIds.has(r.employeeId) || scopeIds.has(r.employeeCode))
 );

 // Group by employeeCode → sum late minutes + collect days

 records.forEach(r => {
 const [h, m] = r.checkIn.split(':').map(Number);
 const lateMin = Math.max(0, (h * 60 + m) - thresholdMinutes);
 if (lateMin <= 0) return;
 const key = r.employeeId || r.employeeCode;
 if (!byEmp[key]) {
 byEmp[key] = { employeeId: r.employeeId, employeeCode: r.employeeCode, employeeName: r.employeeName, days: [], totalMinutes: 0 };

 byEmp[key].days.push({ date: r.date, checkIn: r.checkIn, lateMinutes: lateMin });
 byEmp[key].totalMinutes += lateMin;
 });

 const summary = Object.values(byEmp).sort((a, b) => b.totalMinutes - a.totalMinutes);

 // Generate month options (last 12 months)

 const now = new Date();
 for (let i = 0; i < 12; i++) {
 const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
 const ms = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
 monthOptions.push({ value: ms, label: d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long' }) });

 const settings = DB.load('settings');
 const lateThreshold = settings.lateThreshold || '09:01';
 const [lthH, lthM] = lateThreshold.split(':').map(Number);
 const thresholdMinutes = lthH * 60 + lthM;
 const records = DB.load('attendanceRecords').filter(r =>
 (r.employeeCode === empCode || r.employeeId === empCode) &&
 r.date.startsWith(monthStr) &&
 r.checkIn && r.checkIn >= lateThreshold
 ).sort((a, b) => a.date.localeCompare(b.date));

 const emp = getEmployee(records[0]?.employeeId || empCode);
 const empName = emp ? `${emp.firstName} ${emp.lastName}` : (records[0]?.employeeName || empCode);
 const empDept = emp ? emp.department : 'พนักงานใหม่';

 const days = records.map(r => {
 const [h, m] = r.checkIn.split(':').map(Number);
 const lateMin = Math.max(0, (h * 60 + m) - thresholdMinutes);
 return { ...r, lateMinutes: lateMin };
 });
 const totalMin = days.reduce((s, d) => s + d.lateMinutes, 0);

 const body = `
 <div style="margin-bottom:14px;padding:12px;background:var(--gray-100);border-radius:8px;">
 <div><strong>พนักงาน:</strong> ${empName} (${empCode})</div>
 <div><strong>แผนก:</strong> ${empDept}</div>
 <div><strong>เดือน:</strong> ${new Date(monthStr+'-01').toLocaleDateString('th-TH', {year:'numeric', month:'long'})}</div>
 <div><strong>รวม:</strong> มาสาย <span style="color:var(--danger);font-weight:700;">${days.length} ครั้ง</span> · รวม <span style="color:var(--danger);font-weight:700;">${totalMin.toLocaleString()} นาที</span></div>
 </div>
 <table style="width:100%;">
 <thead style="background:var(--gray-100);">
 <tr>
 <th style="padding:8px;text-align:left;">ลำดับ</th>
 <th style="padding:8px;text-align:left;">วันที่</th>
 <th style="padding:8px;text-align:left;">เข้างาน</th>
 <th style="padding:8px;text-align:left;">ออกงาน</th>
 <th style="padding:8px;text-align:right;">สายกี่นาที</th>
 </tr>
 </thead>
 <tbody>
 ${days.map((d, i) => `<tr style="border-bottom:1px solid var(--gray-200);">
 <td style="padding:8px;">${i + 1}</td>
 <td style="padding:8px;">${formatDate(d.date)}</td>
 <td style="padding:8px;"><strong>${d.checkIn}</strong></td>
 <td style="padding:8px;">${d.checkOut || '-'}</td>
 <td style="padding:8px;text-align:right;color:var(--danger);font-weight:600;">${d.lateMinutes} นาที</td>
 </tr>`).join('')}
 <tr style="background:var(--gray-100);font-weight:700;">
 <td colspan="4" style="padding:10px;text-align:right;">รวม:</td>
 <td style="padding:10px;text-align:right;color:var(--danger);">${totalMin.toLocaleString()} นาที</td>
 </tr>
 </tbody>
 </table>
 `;
 showModal(`รายละเอียดการมาสาย — ${empName}`, body, `<button class="btn btn-secondary" onclick="closeModal()">ปิด</button>`);
}

// Excel export for late summary
function exportLateSummaryXLSX() {
 if (!_xlsxCheck()) return;
 const settings = DB.load('settings');
 const lateThreshold = settings.lateThreshold || '09:01';
 const [lthH, lthM] = lateThreshold.split(':').map(Number);
 const thresholdMinutes = lthH * 60 + lthM;
 const monthStr = _lateReportMonth || new Date().toISOString().slice(0, 7);
 const records = DB.load('attendanceRecords').filter(r =>
 r.checkIn && r.checkIn >= lateThreshold && r.date.startsWith(monthStr)
 );

 const byEmp = {};
 records.forEach(r => {
 const [h, m] = r.checkIn.split(':').map(Number);
 const lateMin = Math.max(0, (h * 60 + m) - thresholdMinutes);
 if (lateMin <= 0) return;
 const key = r.employeeId || r.employeeCode;
 if (!byEmp[key]) {
 byEmp[key] = { employeeId: r.employeeId, employeeCode: r.employeeCode, days: [], totalMinutes: 0 };
 }
 byEmp[key].days.push({ date: r.date, checkIn: r.checkIn, checkOut: r.checkOut, lateMinutes: lateMin });
 byEmp[key].totalMinutes += lateMin;
 });
 const summary = Object.values(byEmp).sort((a, b) => b.totalMinutes - a.totalMinutes);

 const wb = XLSX.utils.book_new();

 // Sheet 1: Summary
 const sheet1 = [
 ['รายงานมาสายสะสม — เดือน ' + new Date(monthStr+'-01').toLocaleDateString('th-TH', {year:'numeric', month:'long'})],
 [`เกณฑ์มาสาย: หลัง ${lateThreshold}`],
 [],
 ['อันดับ', 'รหัส', 'ชื่อ-นามสกุล', 'แผนก', 'จำนวนวันมาสาย', 'รวมเวลาสาย (นาที)', 'เฉลี่ย (นาที/ครั้ง)']
 ];
 summary.forEach((e, i) => {
 const emp = getEmployee(e.employeeId);
 sheet1.push([
 i + 1,
 e.employeeCode,
 emp ? `${emp.firstName} ${emp.lastName}` : '-',
 emp ? emp.department : 'พนักงานใหม่',
 e.days.length,
 e.totalMinutes,
 Math.round(e.totalMinutes / e.days.length)
 ]);
 });
 const ws1 = XLSX.utils.aoa_to_sheet(sheet1);
 ws1['!cols'] = [{wch:8},{wch:14},{wch:22},{wch:18},{wch:14},{wch:18},{wch:14}];
 XLSX.utils.book_append_sheet(wb, ws1, 'สรุป');

 // Sheet 2: Detail
 const sheet2 = [
 ['รายละเอียดวันที่มาสาย'],
 [],
 ['รหัส', 'ชื่อ-นามสกุล', 'แผนก', 'วันที่', 'เวลาเข้างาน', 'เวลาออกงาน', 'สายกี่นาที']
 ];
 summary.forEach(e => {
 const emp = getEmployee(e.employeeId);
 const empName = emp ? `${emp.firstName} ${emp.lastName}` : '-';
 const empDept = emp ? emp.department : 'พนักงานใหม่';
 e.days.sort((a, b) => a.date.localeCompare(b.date)).forEach(d => {
 sheet2.push([e.employeeCode, empName, empDept, d.date, d.checkIn, d.checkOut || '-', d.lateMinutes]);
 });
 });
 const ws2 = XLSX.utils.aoa_to_sheet(sheet2);
 ws2['!cols'] = [{wch:14},{wch:22},{wch:18},{wch:14},{wch:12},{wch:12},{wch:14}];
 XLSX.utils.book_append_sheet(wb, ws2, 'รายละเอียด');

 XLSX.writeFile(wb, `รายงานมาสายสะสม-${monthStr}.xlsx`);
 toast(`Export ${summary.length} คน สำเร็จ`);
}

function exportCSV(type) {
 const table = document.getElementById('reportTable');
 if (!table) return;
 let csv = '﻿'; // BOM for Thai
 table.querySelectorAll('tr').forEach(tr => {
 const cells = [...tr.children].map(td => `"${td.textContent.replace(/"/g,'""').trim()}"`);
 csv += cells.join(',') + '\n';
 });
 const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = `report_${type}_${today()}.csv`;
 a.click();
 toast('Export สำเร็จ!');
}

function deleteTimeCert(id) {
 if (currentUser.role !== 'admin') { toast('เฉพาะ Admin', 'error'); return; }
 const reqs = DB.load('timeCertRequests', []);
 const r = reqs.find(x => x.id === id);
 if (!r) return;
 const emp = getEmployee(r.employeeId);
 const empName = emp ? `${emp.firstName} ${emp.lastName}` : r.employeeId;
 if (!confirm(`ยืนยันลบคำขอรับรองเวลา?\n\nพนักงาน: ${empName}\nวันที่: ${formatDate(r.date)}\nเวลา: ${r.claimedCheckIn} - ${r.claimedCheckOut || '-'}\nสถานะ: ${r.status}\n\nการลบไม่สามารถย้อนกลับได้`)) return;
 DB.save('timeCertRequests', reqs.filter(x => x.id !== id));
 DB.save('notifications', DB.load('notifications').filter(n => n.refId !== id));
 auditLog('time-cert-delete', 'time-cert', id, `${empName} ${formatDate(r.date)} (${r.status})`);
 toast('ลบสำเร็จ');
 renderPage();
}

function exportTimeCertXLSX() {
 if (!_xlsxCheck()) return;
 const all = DB.load('timeCertRequests', []).slice().sort((a,b) => new Date(b.requestDate) - new Date(a.requestDate));
 if (!all.length) { toast('ไม่มีข้อมูลคำขอรับรองเวลา', 'error'); return; }

 const wb = XLSX.utils.book_new();

 // Sheet 1: รวมทั้งหมด
 const header = ['วันที่ขอ','รหัสพนักงาน','ชื่อ-นามสกุล','แผนก','วันที่ทำงาน','เวลาเข้าจริง','เวลาเลิกจริง','สแกน-เข้า','สแกน-ออก','เหตุผล','หัวหน้างาน','สถานะ','วันอนุมัติ','หมายเหตุผู้อนุมัติ','มีหลักฐาน'];
 const rows = [header];
 const statusLabel = { pending: 'รออนุมัติ', approved: 'อนุมัติแล้ว', rejected: 'ปฏิเสธ' };
 all.forEach(r => {
 const emp = getEmployee(r.employeeId);
 const mgr = r.managerId ? getEmployee(r.managerId) : null;
 const scan = DB.load('attendanceRecords').find(x => x.employeeId === r.employeeId && x.date === r.date);
 rows.push([
 r.requestDate || '',
 r.employeeId || '',
 emp ? `${emp.firstName} ${emp.lastName}` : '-',
 emp?.department || '-',
 r.date || '',
 r.claimedCheckIn || '-',
 r.claimedCheckOut || '-',
 scan?.checkIn || '-',
 scan?.checkOut || '-',
 r.reason || '',
 mgr ? `${mgr.firstName} ${mgr.lastName}` : '-',
 statusLabel[r.status] || r.status,
 r.approvedDate || '-',
 r.approverNote || '-',
 r.attachment ? 'มี' : '-'
 ]);
 });
 const ws1 = XLSX.utils.aoa_to_sheet(rows);
 ws1['!cols'] = [{wch:12},{wch:14},{wch:22},{wch:16},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:30},{wch:18},{wch:12},{wch:12},{wch:20},{wch:10}];
 XLSX.utils.book_append_sheet(wb, ws1, 'รับรองเวลา');

 // Sheet 2: Summary by status / by employee
 const summary = [
 ['สรุปคำขอรับรองเวลา'], [],
 ['สถานะ','จำนวน'],
 ['รออนุมัติ', all.filter(r => r.status === 'pending').length],
 ['อนุมัติแล้ว', all.filter(r => r.status === 'approved').length],
 ['ปฏิเสธ', all.filter(r => r.status === 'rejected').length],
 ['รวมทั้งหมด', all.length],
 [],
 ['สรุปต่อพนักงาน',''],
 ['รหัส', 'ชื่อ-นามสกุล', 'รออนุมัติ', 'อนุมัติแล้ว', 'ปฏิเสธ', 'รวม']
 ];
 const byEmp = {};
 all.forEach(r => {
 byEmp[r.employeeId] = byEmp[r.employeeId] || { pending:0, approved:0, rejected:0 };
 byEmp[r.employeeId][r.status] = (byEmp[r.employeeId][r.status] || 0) + 1;
 });
 Object.entries(byEmp).sort((a,b) => (b[1].pending+b[1].approved+b[1].rejected) - (a[1].pending+a[1].approved+a[1].rejected)).forEach(([eid, c]) => {
 const emp = getEmployee(eid);
 summary.push([eid, emp ? `${emp.firstName} ${emp.lastName}` : '-', c.pending, c.approved, c.rejected, c.pending+c.approved+c.rejected]);
 });
 const ws2 = XLSX.utils.aoa_to_sheet(summary);
 ws2['!cols'] = [{wch:14},{wch:22},{wch:12},{wch:14},{wch:10},{wch:10}];
 XLSX.utils.book_append_sheet(wb, ws2, 'สรุป');

 XLSX.writeFile(wb, `รายงานรับรองเวลา-${today()}.xlsx`);
 toast(`Export ${all.length} คำขอ สำเร็จ`);
}

function updateVacAccrualPreview() {
 const body = document.getElementById('vacAccrualPreviewBody');
 if (!body) return;
 const enabled = document.getElementById('qVacAccrualEnabled')?.checked;
 if (!enabled) {
 body.innerHTML = '<span style="color:var(--gray-500);">(ปิดใช้งานอยู่ — ใช้ค่า Default ที่กำหนดในส่วน "สิทธิ์การลาเริ่มต้น")</span>';
 return;
 }
 const base = parseFloat(document.getElementById('qVacAccrualBase').value) || 0;
 const startYear = parseInt(document.getElementById('qVacAccrualStartYear').value) || 2;
 const inc = parseFloat(document.getElementById('qVacAccrualIncrement').value) || 0;
 const max = parseFloat(document.getElementById('qVacAccrualMax').value) || 0;
 const previews = [];
 for (let y = 1; y <= 12; y++) {
 let days;
 if (y < startYear) days = base;
 else {
 const yearsOver = y - startYear + 1;
 days = base + yearsOver * inc;
 if (max) days = Math.min(days, max);
 }
 const isCap = max && days >= max;
 previews.push(`<div style="display:inline-block;margin:3px;padding:6px 10px;background:white;border:1px solid var(--gray-300);border-radius:6px;${isCap ? 'border-color:var(--success);background:#f0fdf4;' : ''}">ปี ${y}: <strong>${days}</strong> วัน${isCap ? ' (เพดาน)' : ''}</div>`);
 }
 body.innerHTML = previews.join('');
}

function submitCompany(e, editId) {
 e.preventDefault();
 if (currentUser.role !== 'admin') return;
 const s = DB.load('settings');
 if (!Array.isArray(s.companies)) s.companies = getCompanies();
 const newId = document.getElementById('coId').value.trim().toLowerCase();
 const label = document.getElementById('coLabel').value.trim();
 const name = document.getElementById('coName').value.trim();
 const data = {
 id: editId || newId,
 label, name,
 address: document.getElementById('coAddress').value.trim(),
 taxId: document.getElementById('coTaxId').value.trim(),
 phone: document.getElementById('coPhone').value.trim(),
 logo: document.getElementById('coLogo').value.trim() || 'logo-black.png'
 };
 if (!data.id || !label || !name) { toast('กรอกข้อมูลให้ครบ (ID, ชื่อย่อ, ชื่อเต็ม)', 'error'); return; }
 if (!/^[a-z0-9_-]+$/.test(data.id)) { toast('รหัส ID ใช้ได้แค่ a-z, 0-9, - และ _', 'error'); return; }

 if (editId) {
 const idx = s.companies.findIndex(x => x.id === editId);
 if (idx < 0) { toast('ไม่พบบริษัท', 'error'); return; }
 s.companies[idx] = data;
 auditLog('company-edit', 'company', editId, `${label} (${name})`);
 } else {
 if (s.companies.find(x => x.id === data.id)) { toast(`ID "${data.id}" ซ้ำกับบริษัทที่มีอยู่แล้ว`, 'error'); return; }
 s.companies.push(data);
 auditLog('company-add', 'company', data.id, `${label} (${name})`);
 }
 DB.save('settings', s);
 closeModal();
 toast(editId ? 'บันทึกการแก้ไขสำเร็จ' : `เพิ่มบริษัท "${label}" สำเร็จ`);
 renderPage();
}

function deleteCompany(id) {
 if (currentUser.role !== 'admin') { toast('เฉพาะ Admin', 'error'); return; }
 const list = getCompanies();
 const c = list.find(x => x.id === id);
 if (!c) return;
 const empCount = DB.load('employees').filter(e => e.company === id).length;
 if (empCount > 0) {
 alert(`ลบบริษัท "${c.label}" ไม่ได้\n\nมีพนักงาน ${empCount} คนสังกัดอยู่ — ย้ายพนักงานเหล่านี้ไปบริษัทอื่นก่อนค่อยลบได้`);
 return;
 }
 if (!confirm(`ยืนยันลบบริษัท "${c.label}" (${id})?\n\nการลบไม่สามารถย้อนกลับได้`)) return;
 const s = DB.load('settings');
 s.companies = (s.companies || list).filter(x => x.id !== id);
 DB.save('settings', s);
 auditLog('company-delete', 'company', id, c.label);
 toast(`ลบบริษัท "${c.label}" สำเร็จ`);
 renderPage();
}

// Helpers for the dynamic Leave Policy card
function _formatCutoff(mmdd) {
 if (!mmdd) return '31 มี.ค.';
 const [m, d] = String(mmdd).split('-').map(Number);
 const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
 return `${d} ${months[m-1] || ''}`;
}

function _buildVacationPolicyText(settings) {
 const ac = settings.vacationAccrual;
 if (!ac || !ac.enabled) {
 return `<div style="margin-bottom:14px;"><strong>ลาพักร้อน</strong><div class="text-sm">${settings.leaveQuotas.vacation} วัน/ปี (Default ทั้งระบบ)</div></div>`;
 }
 const base = ac.base ?? 6;
 const sy = ac.startYear ?? 2;
 const inc = ac.incrementPerYear ?? 1;
 const max = ac.maxDays ?? 0;

 const parts = [];
 // First range: years before increment kicks in
 if (sy > 1) parts.push(`ปีที่ 1${sy > 2 ? '-' + (sy-1) : ''}: ${base} วัน`);
 else parts.push(`ปีที่ 1: ${base} วัน`);

 // Increment phase
 if (inc > 0) {
 parts.push(`+${inc} วัน/ปี ตั้งแต่ปีที่ ${sy}`);
 }

 // Cap
 if (max) {
 // Calculate year when cap is hit
 const yearsToReachMax = Math.ceil((max - base) / inc) + 1;
 const capYear = sy + yearsToReachMax - 1;
 parts.push(`เพดานสูงสุด ${max} วัน (ตั้งแต่ปีที่ ${capYear})`);
 }

 return `<div style="margin-bottom:14px;"><strong>ลาพักร้อนตามอายุงาน</strong><div class="text-sm">${parts.join(' · ')}</div></div>`;
}

function toggleOnbTask(empId, taskId, phase) {
 const tasks = DB.load('onboardingTasks', []);
 const idx = tasks.findIndex(t => t.employeeId === empId && t.taskId === taskId && t.phase === phase);
 if (idx >= 0) {
  tasks[idx].done = !tasks[idx].done;
  tasks[idx].updatedAt = new Date().toISOString();
 } else {
  tasks.push({ id: uid('OT'), employeeId: empId, taskId, phase, done: true, updatedAt: new Date().toISOString() });
 }
 DB.save('onboardingTasks', tasks);
 auditLog('onboarding-toggle', 'employee', empId, `Task: ${taskId} (${phase})`);
 renderOnboarding();
}

function submitSelfEval(e) {
 e.preventDefault();
 const settings = DB.load('settings');
 const criteria = settings.evalCriteria || [];
 const selfScores = {};
 let totalScore = 0;
 criteria.forEach(c => {
  selfScores[c.id] = parseInt(document.getElementById(`evalSelf_${c.id}`).value);
  totalScore += selfScores[c.id] * c.weight / 100;
 });
 const evals = DB.load('evaluations', []);
 const existing = evals.findIndex(v => v.employeeId === currentUser.id && v.cycle === 'probation');
 const data = {
  id: existing >= 0 ? evals[existing].id : uid('EV'),
  employeeId: currentUser.id,
  cycle: 'probation',
  selfScores,
  selfNote: document.getElementById('evalSelfNote').value,
  totalScore: Math.round(totalScore),
  status: 'self-done',
  createdAt: existing >= 0 ? evals[existing].createdAt : new Date().toISOString(),
  updatedAt: new Date().toISOString(),
  managerScores: existing >= 0 ? evals[existing].managerScores : null,
  managerNote: existing >= 0 ? evals[existing].managerNote : null,
  managerTotal: existing >= 0 ? evals[existing].managerTotal : null
 };
 if (existing >= 0) evals[existing] = data; else evals.push(data);
 DB.save('evaluations', evals);
 if (currentUser.managerId) {
  notify(currentUser.managerId, `${currentUser.firstName} ${currentUser.lastName} ส่งประเมินตนเอง ${data.totalScore}% รอประเมิน`, 'eval', data.id);
 }
 auditLog('eval-self', 'employee', currentUser.id, `Score ${data.totalScore}%`);
 toast('ส่งประเมินสำเร็จ');
 renderMyEvaluation();
}

function submitMgrEval(e, empId) {
 e.preventDefault();
 const settings = DB.load('settings');
 const criteria = settings.evalCriteria || [];
 const managerScores = {};
 let total = 0;
 criteria.forEach(c => {
  managerScores[c.id] = parseInt(document.getElementById(`mgrEval_${c.id}`).value);
  total += managerScores[c.id] * c.weight / 100;
 });
 const evals = DB.load('evaluations', []);
 const idx = evals.findIndex(v => v.employeeId === empId && v.cycle === 'probation');
 if (idx >= 0) {
  evals[idx].managerScores = managerScores;
  evals[idx].managerNote = document.getElementById('mgrEvalNote').value;
  evals[idx].managerTotal = Math.round(total);
  evals[idx].managerId = currentUser.id;
  evals[idx].managerEvaluatedAt = new Date().toISOString();
  evals[idx].status = 'completed';
  DB.save('evaluations', evals);
  notify(empId, `ผลประเมินทดลองงานพร้อมแล้ว: ${Math.round(total)}%`, 'eval', evals[idx].id);
  auditLog('eval-manager', 'employee', empId, `Score ${Math.round(total)}%`);
  closeModal();
  toast('บันทึกประเมินสำเร็จ');
  renderTeamEvaluations();
 }
}

function _execComputeSnapshot() {
 const emps = DB.load('employees').filter(e => e.active);
 const team = currentUser.role === 'admin' ? emps : emps.filter(e => e.managerId === currentUser.id);
 const monthStart = new Date().toISOString().slice(0,7);
 const leavesThisMonth = DB.load('leaveRequests').filter(r =>
 team.find(t => t.id === r.employeeId) && r.startDate && r.startDate.startsWith(monthStart) && r.status === 'approved'
 );
 const newHires = team.filter(e => (new Date() - new Date(e.startDate)) / 86400000 < 60);

 const byCompany = {};
 team.forEach(e => { byCompany[e.company || '-'] = (byCompany[e.company || '-'] || 0) + 1; });

 const byDept = {};
 team.forEach(e => { byDept[e.department || '-'] = (byDept[e.department || '-'] || 0) + 1; });

 const leaveCounts = { vacation: 0, sick: 0, personal: 0, other: 0 };
 leavesThisMonth.forEach(r => {
 if (r.type === 'vacation') leaveCounts.vacation++;
 else if (r.type === 'sick' || r.type.startsWith('sick-')) leaveCounts.sick++;
 else if (r.type === 'personal') leaveCounts.personal++;
 else leaveCounts.other++;
 });

 const evals = DB.load('evaluations', []).filter(e => team.find(t => t.id === e.employeeId) && e.managerTotal);
 const topPerf = evals.slice().sort((a,b) => b.managerTotal - a.managerTotal).slice(0, 10);
 const avgScore = evals.length ? Math.round(evals.reduce((s,e) => s + e.managerTotal, 0) / evals.length) : 0;

 return { emps, team, newHires, leavesThisMonth, byCompany, byDept, leaveCounts, evals, topPerf, avgScore };
}

async function exportExecDashboardPNG(mode) {
 const target = document.getElementById('execDashboardCapture');
 if (!target) { toast('ไม่พบเนื้อหา dashboard', 'error'); return; }
 if (typeof html2canvas !== 'function') {
 toast('ไลบรารี html2canvas โหลดไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต', 'error');
 return;
 }
 toast('กำลังสร้างรูป...', 'info');
 try {
 const canvas = await html2canvas(target, {
 backgroundColor: '#ffffff',
 scale: 2,
 logging: false,
 useCORS: true,
 windowWidth: target.scrollWidth,
 windowHeight: target.scrollHeight
 });
 const filename = `Exec-Dashboard-${today()}.png`;

 if (mode === 'download') {
 const link = document.createElement('a');
 link.download = filename;
 link.href = canvas.toDataURL('image/png');
 link.click();
 toast('ดาวน์โหลดสำเร็จ');
 return;
 }
 const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
 if (!blob) { toast('สร้างไฟล์ภาพไม่สำเร็จ', 'error'); return; }
 const file = new File([blob], filename, { type: 'image/png' });
 if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
 try {
 await navigator.share({ files: [file], title: 'Dashboard ผู้บริหาร', text: `รายงาน Dashboard ผู้บริหาร ${formatDate(today())}` });
 return;
 } catch (e) { if (e.name === 'AbortError') return; }
 }
 if (navigator.clipboard?.write) {
 try {
 await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
 toast('คัดลอกรูปไปคลิปบอร์ดแล้ว', 'info');
 return;
 } catch (e) { console.warn(e); }
 }
 const dataUrl = canvas.toDataURL('image/png');
 showModal('ตัวอย่าง Dashboard', `
 <div class="alert alert-info mb-3">กดค้างที่รูปเพื่อบันทึก หรือใช้ปุ่มดาวน์โหลด</div>
 <div style="text-align:center;"><img src="${dataUrl}" style="max-width:100%;border:1px solid var(--gray-300);border-radius:8px;"></div>
 `, `<button class="btn btn-secondary" onclick="closeModal()">ปิด</button>
 <button class="btn btn-primary" onclick="exportExecDashboardPNG('download'); closeModal();">ดาวน์โหลด</button>`);
 } catch (err) {
 console.error('[exportExecDashboardPNG]', err);
 toast('สร้างรูปไม่สำเร็จ: ' + err.message, 'error');
 }
}

document.addEventListener('DOMContentLoaded', async () => {
 // ============================================================
 // STARTUP SEQUENCE (CRITICAL — race conditions previously caused data loss)
 // Rules:
 // 1. Pull cloud first — cloud is authoritative
 // 2. Seed locally ONLY if cloud is truly empty AND we haven't initialized
 // 3. DO NOT cloudPushAll on every load — it overwrites cloud with stale local
 // 4. Setup realtime AFTER initial pull so we don't miss events
 // ============================================================
 let pullResult = { ok: false, count: 0 };
 if (cloudSync) {
 const loadingDiv = document.createElement('div');
 loadingDiv.id = 'cloudLoading';
 loadingDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#1F4E79;color:white;padding:8px;text-align:center;z-index:9999;font-size:13px;';
 loadingDiv.innerHTML = ' กำลังโหลดข้อมูลจาก Cloud...';
 document.body.appendChild(loadingDiv);

 pullResult = await DB.cloudPullAllSafe();
 setupCloudRealtime();

 if (pullResult.ok) {
 loadingDiv.innerHTML = pullResult.count > 0 ? ` ซิงค์จาก Cloud สำเร็จ (${pullResult.count} รายการ)` : ' Cloud พร้อม (ว่าง)';
 loadingDiv.style.background = '#16a34a';
 } else {
 loadingDiv.innerHTML = ` ⚠ ดึงข้อมูลจาก Cloud ไม่สำเร็จ - ใช้ข้อมูลในเครื่อง (offline mode)`;
 loadingDiv.style.background = '#f59e0b';
 console.error('[Startup] Cloud pull failed:', pullResult.reason);
 }
 setTimeout(() => loadingDiv.remove(), 3000);
 }

 const alreadyInitialized = DB.load('initialized', false);
 if (!alreadyInitialized) {
 if (cloudSync && !pullResult.ok) {
 // Cloud pull failed AND localStorage is empty → DANGEROUS to seed
 // because we might overwrite real data when cloud comes back online.
 // Show warning and stop.
 alert('⚠ Cloud sync ไม่สำเร็จ และเครื่องไม่มีข้อมูลเดิม\n\nกรุณาเช็คอินเทอร์เน็ต แล้ว refresh หน้าใหม่');
 return;
 }
 // Safe to seed: cloud is truly empty OR cloud sync disabled
 seedData();
 // Push initial seed up to cloud — ONLY this one time, when truly fresh install
 if (cloudSync) {
 console.log('[Startup] Fresh install detected — pushing initial seed to cloud');
 await DB.cloudPushAll();
 }
 }
 // IMPORTANT: NO unconditional cloudPushAll() here.
 // Every save goes through DB.save → _cloudUpsert. That's sufficient.

 // v1.4.10 settings migration: update old defaults to new defaults (idempotent)
 migrateSettings_v1_4_10();
 // v1.4.14: hard-reset personal leave = 3 for everyone (legal standard)
 migrateLeaveQuota_v1_4_14();

 if (restoreSession()) {
 showApp();
 }

 document.getElementById('loginForm').addEventListener('submit', e => {
 e.preventDefault();
 const id = document.getElementById('loginEmpId').value.trim().toUpperCase();
 const pass = document.getElementById('loginPassword').value;
 if (login(id, pass)) {
 // Check if force password change is required
 if (currentUser.forceChangePassword) {
 showChangePasswordPage();
 } else {
 showApp();
 }
 } else {
 document.getElementById('loginAlert').innerHTML = '<div class="alert alert-error">รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง</div>';
 }
 });

 document.getElementById('changePassForm').addEventListener('submit', e => {
 e.preventDefault();
 const p1 = document.getElementById('newPass1').value;
 const p2 = document.getElementById('newPass2').value;
 const alertDiv = document.getElementById('changePassAlert');

 if (p1.length < 4) {
 alertDiv.innerHTML = '<div class="alert alert-error">รหัสผ่านต้องอย่างน้อย 4 ตัวอักษร</div>';
 return;
 }
 if (p1 !== p2) {
 alertDiv.innerHTML = '<div class="alert alert-error">รหัสผ่านไม่ตรงกัน</div>';
 return;
 }

 // Save new password
 const emps = DB.load('employees');
 const emp = emps.find(x => x.id === currentUser.id);
 emp.password = p1;
 emp.forceChangePassword = false;
 DB.save('employees', emps);

 // Update current user
 currentUser.password = p1;
 currentUser.forceChangePassword = false;
 sessionStorage.setItem('hr_currentUser', JSON.stringify(currentUser));

 alertDiv.innerHTML = '<div class="alert alert-success"> เปลี่ยนรหัสผ่านสำเร็จ</div>';
 setTimeout(() => {
 document.getElementById('changePasswordPage').classList.add('hidden');
 showApp();
 }, 1200);
 });
});

function showChangePasswordPage() {
 document.getElementById('loginPage').classList.add('hidden');
 document.getElementById('changePasswordPage').classList.remove('hidden');
 document.getElementById('changePassAlert').innerHTML = '';
 document.getElementById('newPass1').value = '';
 document.getElementById('newPass2').value = '';
}

function showApp() {
 document.getElementById('loginPage').classList.add('hidden');
 document.getElementById('app').classList.remove('hidden');
 document.getElementById('userName').textContent = currentUser.firstName + ' ' + currentUser.lastName;
 document.getElementById('userEmpId').textContent = currentUser.id + ' • ' + currentUser.department;
 const roleNames = {employee: 'พนักงาน', manager: 'หัวหน้างาน', accountant: 'บัญชี', admin: 'แอดมิน HR'};
 document.getElementById('userRole').textContent = roleNames[currentUser.role];
 // Default landing
 const defaultPage = currentUser.role === 'admin' ? 'dashboard' : 'dashboard-overview';
 navigate(defaultPage);
}
</script>
</body>
</html>
